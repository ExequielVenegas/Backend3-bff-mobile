spring.application.name=bff-mobile
server.port=8082
services.account.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8090}
services.managed-account.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8090}
services.customer.base-url=${CUSTOMER_SERVICE_URL:http://localhost:8091}
services.payment.base-url=${PAYMENT_SERVICE_URL:http://localhost:8092}
spring.cloud.config.enabled=false
eureka.client.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:https://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.audiences=bff-mobile
management.endpoints.web.exposure.include=health,info
